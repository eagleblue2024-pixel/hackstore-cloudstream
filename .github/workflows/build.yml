name: Compilar Plugin CloudStream

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{runner.os}}-gradle-

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x gradlew

      - name: Compilar Plugin y Generar Repositorio
        run: ./gradlew make

      - name: Guardar artefacto Hackstore.cs3
        uses: actions/upload-artifact@v4
        with:
          name: Hackstore.cs3
          path: |
            build/*.cs3
            build/libs/*.cs3

      - name: Publicar en rama builds (Repositorio CloudStream)
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          branch: builds
          folder: build
